<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài liệu Ngữ pháp - Học Tiếng Đức</title>
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Thư viện Mozilla PDF.js qua CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* ====== HỆ THỐNG THEME (Dark / Light) ====== */
        :root, html[data-theme="light"] {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text: #16213e;
            --text-muted: #6b7280;
            --border: #e8ebf2;
            --primary: #0f3460;
            --primary-hover: #16213e;
            --primary-soft: #e8edf7;
            --header-bg: rgba(255, 255, 255, 0.85);
            --pdf-bg: #eef1f8;
        }
        html[data-theme="dark"] {
            --bg: #0f1424;
            --card-bg: #1c2336;
            --text: #e9ecf5;
            --text-muted: #9aa3bd;
            --border: #2a3450;
            --primary: #3b6fb5;
            --primary-hover: #4d83cf;
            --primary-soft: #232c44;
            --header-bg: rgba(20, 26, 44, 0.85);
            --pdf-bg: #0a0d18;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        /* ====== HEADER ====== */
        .site-header {
            position: sticky; top: 0; z-index: 10;
            background: var(--header-bg);
            backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            max-width: 960px; margin: 0 auto; padding: 12px 20px;
            display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 38px; height: 38px;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--card-bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            cursor: pointer; font-size: 18px; text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
        }
        .back-btn:hover { background: var(--primary-soft); border-color: var(--primary); }
        .back-btn:active { transform: scale(0.94); }
        .header-title-box { flex: 1; min-width: 0; }
        .header-title {
            font-size: 16px; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .header-sub { font-size: 12px; color: var(--text-muted); }

        /* Nút tải file */
        .btn-download {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-download:hover { background: var(--primary-soft); border-color: var(--primary); }
        .btn-download:active { transform: scale(0.96); }

        /* ====== KHU VỰC HIỂN THỊ CÁC TRANG PDF ====== */
        main {
            max-width: 960px; width: 100%; margin: 0 auto;
            padding: 16px 20px 30px; flex: 1;
            display: flex; flex-direction: column;
        }
        .viewer-container {
            background: var(--pdf-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            flex: 1; min-height: 75vh;
            display: flex; flex-direction: column;
            align-items: center;
            padding: 16px 10px;
            gap: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        /* Từng trang PDF render bằng thẻ Canvas */
        .pdf-page-canvas {
            max-width: 100%;
            height: auto !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            background: #ffffff;
            transition: filter 0.3s;
        }

        /* Đảo màu nền và chữ khi ở Dark Mode giống Google Docs ban đêm */
        html[data-theme="dark"] .pdf-page-canvas {
            filter: invert(0.92) hue-rotate(180deg) contrast(0.95);
        }

        /* Trạng thái tải / thông báo */
        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
            margin: auto;
            text-align: center;
        }
        .empty-notice {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 60px 20px; flex: 1;
            background: var(--card-bg); width: 100%; border-radius: 12px;
        }
        .empty-notice.show { display: flex; }
        .empty-notice .emoji { font-size: 48px; margin-bottom: 12px; }
        .empty-notice h3 { margin: 0 0 8px; font-size: 18px; }
        .empty-notice p { margin: 0 0 20px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a class="back-btn" href="grammar.html" title="Quay lại">←</a>
            <div class="header-title-box">
                <div class="header-title" id="pageTitle">Tài liệu Ngữ pháp</div>
                <div class="header-sub">Tóm tắt & Bài giảng chi tiết</div>
            </div>
            <a class="btn-download" id="downloadBtn" download style="display: none;">📥 Tải về</a>
        </div>
    </header>

    <main>
        <div class="viewer-container" id="viewerContainer">
            <div class="loading-text" id="loadingText">Đang tải tài liệu...</div>
            <div class="empty-notice" id="emptyNotice">
                <div class="emoji">📝</div>
                <h3>Bài học đang được chuẩn bị</h3>
                <p>Tài liệu PDF cho bài học này sẽ sớm được tải lên.</p>
                <a class="back-btn" href="grammar.html" style="width: auto; padding: 8px 16px; font-size: 14px;">Quay lại danh mục</a>
            </div>
        </div>
    </main>

    <script>
        (function () {
            const saved = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", saved);
        })();

        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const GRAMMAR_TITLES = {
            "satzarten": "Satzarten — Các loại câu cơ bản",
            "praesens": "Konjugation Präsens — Chia động từ hiện tại",
            "faelle-artikel": "Fälle, Artikel & Pronomen — Cách, mạo từ, đại từ",
            "praepositionen-a1": "Präpositionen — Giới từ cố định (Akk & Dat)",
            "modalverben": "Modalverben — Động từ khiếm khuyết",
            "perfekt": "Perfekt — Thì hiện tại hoàn thành",
            "negation": "Negation — Phủ định (nicht / kein)",
            "plural": "Plural — Số nhiều của danh từ",
            "vergleich": "Vergleich (so…wie) — So sánh bằng",
            "praeteritum": "Präteritum — Quá khứ đơn",
            "perfekt-vertiefung": "Perfekt Vertiefung — Mở rộng Perfekt",
            "plusquamperfekt": "Plusquamperfekt — Quá khứ hoàn thành",
            "futur-i": "Futur I — Tương lai đơn",
            "wechselpraepositionen": "Wechselpräpositionen — Giới từ linh hoạt",
            "reflexivverben": "Reflexivverben — Động từ phản thân",
            "genitiv": "Genitiv — Sở hữu cách",
            "komparativ": "Komparativ & Superlativ — So sánh hơn và nhất",
            "verben-praepositionen": "Verben mit Präpositionen — Động từ đi kèm giới từ",
            "temporalsaetze": "Temporalsätze — Mệnh đề thời gian (cơ bản)",
            "nebensaetze": "Nebensätze (dass, weil, ob) — Mệnh đề phụ cơ bản",
            "indefinitpronomen": "Indefinitpronomen — Đại từ bất định",
            "adjektivdeklination": "Adjektivdeklination — Chia tính từ",
            "n-deklination": "N-Deklination — Biến cách đặc biệt giống đực",
            "vorgangspassiv": "Vorgangspassiv — Bị động hành động",
            "konjunktiv-ii": "Konjunktiv II — Giả định cơ bản",
            "konjunktionaladverbien": "Konjunktionaladverbien — Trạng từ nối",
            "relativsatz": "Relativsatz — Mệnh đề quan hệ",
            "infinitiv-zu": "Infinitiv mit zu & Finalsätze — Mục đích",
            "pronominaladverbien": "Pronominaladverbien — Đại từ chỉ nơi chốn/vật",
            "indirekte-fragen": "Indirekte Fragen — Câu hỏi gián tiếp",
            "temporalsaetze-b1": "Temporalsätze Erweiterung — Mệnh đề thời gian (mở rộng)",
            "kausalsaetze": "Kausalsätze — Mệnh đề lý do",
            "konzessivsaetze": "Konzessivsätze (obwohl, trotzdem) — Nhượng bộ",
            "tekamolo": "TE-KA-MO-LO — Trật tự bổ ngữ nâng cao",
            "passiv-vertiefung": "Passiv Vertiefung — Bị động mở rộng",
            "subjektive-modalverben": "Subjektive Modalverben — Động từ khiếm khuyết chủ quan",
            "konjunktiv-i": "Konjunktiv I — Gián tiếp lời nói (báo chí)",
            "konjunktiv-ii-b2": "Konjunktiv II Vertiefung — Giả định mở rộng",
            "nominalisierung": "Nominalisierung — Chuyển động từ → danh từ",
            "partizip": "Partizip I/II & Partizipialattribute — Phân từ làm định ngữ",
            "funktionsverbgefuege": "Funktionsverbgefüge — Cụm động từ chức năng",
            "modalpartikeln": "Modalpartikeln — Tiểu từ tình thái",
            "konjunktionen": "Fortführende Konjunktionen — Liên từ đôi",
            "futur-ii": "Futur II — Tương lai hoàn thành",
            "adjektiv-als-nomen": "Adjektiv als Nomen — Tính từ hóa danh từ",
            "konzessivsaetze-b2": "Konzessivsätze erweitert — Nhượng bộ nâng cao",
            "konsekutivsaetze": "Konsekutivsätze — Mệnh đề chỉ kết quả"
        };

        const params = new URLSearchParams(window.location.search);
        const lessonId = params.get("id");

        const pageTitle = document.getElementById("pageTitle");
        const viewerContainer = document.getElementById("viewerContainer");
        const loadingText = document.getElementById("loadingText");
        const emptyNotice = document.getElementById("emptyNotice");
        const downloadBtn = document.getElementById("downloadBtn");

        if (lessonId && GRAMMAR_TITLES[lessonId]) {
            pageTitle.textContent = GRAMMAR_TITLES[lessonId];
            const pdfPath = `./grammar-docs/${lessonId}.pdf`;

            loadPdf(pdfPath);
        } else {
            showEmpty();
        }

        async function loadPdf(url) {
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                
                loadingText.remove();

                // Kích hoạt và gán link cho nút tải về
                downloadBtn.href = url;
                downloadBtn.setAttribute("download", `${lessonId}.pdf`);
                downloadBtn.style.display = "inline-flex";

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    const scale = 2.0;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement("canvas");
                    canvas.className = "pdf-page-canvas";
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: canvas.getContext("2d"),
                        viewport: viewport
                    };

                    await page.render(renderContext).promise;
                    viewerContainer.appendChild(canvas);
                }
            } catch (err) {
                showEmpty();
            }
        }

        function showEmpty() {
            if (loadingText) loadingText.remove();
            downloadBtn.style.display = "none";
            emptyNotice.classList.add("show");
        }
    </script>
</body>
</html>
