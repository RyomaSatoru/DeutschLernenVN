<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngữ pháp - Học Tiếng Đức</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        :root, html[data-theme="light"] {
            --bg: #f5f7fb; --card-bg: #ffffff; --text: #16213e;
            --text-muted: #6b7280; --border: #e8ebf2; --input-bg: #ffffff;
            --primary: #0f3460; --primary-hover: #16213e; --primary-soft: #e8edf7;
            --shadow-sm: 0 1px 3px rgba(15,52,96,0.06);
            --header-bg: rgba(255,255,255,0.85); --chip-bg: #eef1f8;
            --a1: #16a34a; --a1-soft: #dcfce7;
            --a2: #2563eb; --a2-soft: #dbeafe;
            --b1: #d97706; --b1-soft: #fef3c7;
            --b2: #9333ea; --b2-soft: #f3e8ff;
        }
        html[data-theme="dark"] {
            --bg: #0f1424; --card-bg: #1c2336; --text: #e9ecf5;
            --text-muted: #9aa3bd; --border: #2a3450; --input-bg: #161c30;
            --primary: #3b6fb5; --primary-hover: #4d83cf; --primary-soft: #232c44;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --header-bg: rgba(20,26,44,0.85); --chip-bg: #232c44;
            --a1: #4ade80; --a1-soft: #14532d;
            --a2: #60a5fa; --a2-soft: #1e3a6e;
            --b1: #fbbf24; --b1-soft: #78350f;
            --b2: #c084fc; --b2-soft: #581c87;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        /* HEADER */
        .site-header {
            position: sticky; top: 0; z-index: 10;
            background: var(--header-bg);
            backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            max-width: 720px; margin: 0 auto;
            padding: 14px 20px;
            display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 38px; height: 38px;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--card-bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            cursor: pointer; font-size: 18px; text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
        }
        .back-btn:hover { background: var(--primary-soft); border-color: var(--primary); }
        .back-btn:active { transform: scale(0.94); }
        .header-title { font-size: 17px; font-weight: 700; flex: 1; }

        main { max-width: 720px; margin: 0 auto; padding: 22px 20px 60px; }

        /* THANH TÌM KIẾM */
        .search-wrap { position: relative; margin-bottom: 28px; }
        .search-wrap .icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            font-size: 17px; pointer-events: none;
        }
        #searchInput {
            width: 100%; padding: 13px 14px 13px 44px;
            border: 1.5px solid var(--border); border-radius: 12px;
            font-size: 15px; background: var(--card-bg); color: var(--text);
            outline: none; font-family: inherit; transition: border-color 0.2s;
        }
        #searchInput:focus { border-color: var(--primary); }
        #searchInput::placeholder { color: var(--text-muted); }

        /* KẾT QUẢ TÌM KIẾM */
        #searchResults { display: none; }
        #searchResults.show { display: block; }
        .search-result-item {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 16px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; margin-bottom: 8px;
            text-decoration: none; color: var(--text);
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .search-result-item:hover { background: var(--primary-soft); border-color: var(--primary); }
        .search-result-item .sr-title { font-size: 14.5px; font-weight: 600; flex: 1; }
        .search-result-item .sr-badge {
            font-size: 11px; font-weight: 800;
            padding: 2px 8px; border-radius: 999px;
        }

        /* DANH MỤC CẤP ĐỘ — MỤC LỚN */
        .level-section { margin-bottom: 24px; overflow: hidden; }

        /* Header cấp lớn: nổi bật, có màu nền theo cấp */
        .level-header {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer; user-select: none;
            transition: opacity 0.15s, transform 0.1s;
            margin-bottom: 10px;
        }
        .level-header:hover { opacity: 0.88; }
        .level-header:active { transform: scale(0.99); }
        .level-header.lv-A1 { background: var(--a1-soft); border: 2px solid var(--a1); }
        .level-header.lv-A2 { background: var(--a2-soft); border: 2px solid var(--a2); }
        .level-header.lv-B1 { background: var(--b1-soft); border: 2px solid var(--b1); }
        .level-header.lv-B2 { background: var(--b2-soft); border: 2px solid var(--b2); }

        .level-badge {
            font-size: 18px; font-weight: 900;
            width: 48px; height: 48px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0; letter-spacing: 0.5px;
        }
        .badge-A1 { background: var(--a1); color: #fff; }
        .badge-A2 { background: var(--a2); color: #fff; }
        .badge-B1 { background: var(--b1); color: #fff; }
        .badge-B2 { background: var(--b2); color: #fff; }

        .level-info { flex: 1; }
        .level-name { font-size: 16px; font-weight: 800; }
        .level-name.c-A1 { color: var(--a1); }
        .level-name.c-A2 { color: var(--a2); }
        .level-name.c-B1 { color: var(--b1); }
        .level-name.c-B2 { color: var(--b2); }
        .level-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }

        .level-count-badge {
            font-size: 12px; font-weight: 700;
            padding: 4px 10px; border-radius: 999px;
            color: #fff;
        }
        .lcb-A1 { background: var(--a1); }
        .lcb-A2 { background: var(--a2); }
        .lcb-B1 { background: var(--b1); }
        .lcb-B2 { background: var(--b2); }

        .level-chevron {
            font-size: 16px; color: var(--text-muted);
            transition: transform 0.25s; flex-shrink: 0;
        }
        .level-section.open .level-chevron { transform: rotate(180deg); }

        /* DANH SÁCH MỤC CON — bài ngữ pháp */
        .lesson-list {
            overflow: hidden; max-height: 0;
            transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1);
            padding: 0 0 0 13px;
            border-left: 3px solid var(--border);
            margin-left: 10px;
            /* Co lại bên phải bằng đúng phần thụt lề bên trái để không tràn */
            margin-right: 0;
            box-sizing: border-box;
        }
        .level-section.open .lesson-list { max-height: 3000px; }

        /* mỗi bài là 1 link */
        .lesson-link {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 10px; margin-bottom: 7px;
            text-decoration: none; color: var(--text);
            font-size: 14px; font-weight: 600;
            transition: background 0.15s, border-color 0.15s;
            /* Đảm bảo không vượt ra ngoài container */
            max-width: 100%;
        }
        .lesson-link:last-child { margin-bottom: 0; }
        .lesson-link:hover {
            background: var(--primary-soft); border-color: var(--primary);
        }
        .lesson-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .dot-A1 { background: var(--a1); }
        .dot-A2 { background: var(--a2); }
        .dot-B1 { background: var(--b1); }
        .dot-B2 { background: var(--b2); }
        .lesson-arrow { margin-left: auto; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a class="back-btn" href="home.html">←</a>
            <span class="header-title">📖 Ngữ pháp</span>
        </div>
    </header>

    <main>
        <div class="search-wrap">
            <span class="icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Tìm ngữ pháp...">
        </div>
        <div id="searchResults"></div>
        <div id="allLevels"></div>
    </main>

    <script>
        (function () {
            const saved = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", saved);
        })();

        // ======================================================
        // DANH MỤC NGỮ PHÁP
        // Thêm bài mới:
        //   1. Tạo file grammar/ten-bai.html (trang đầy đủ có header/back)
        //   2. Thêm 1 dòng vào mảng cấp độ tương ứng bên dưới
        // ======================================================
        const GRAMMAR_INDEX = {
            A1: [
                { id: "satzarten",            title: "Satzarten — Các loại câu cơ bản",                         tags: ["câu trần thuật", "câu hỏi", "W-Frage", "Imperativ", "mệnh lệnh"] },
                { id: "praesens",             title: "Konjugation Präsens — Chia động từ hiện tại",             tags: ["chia động từ", "hiện tại", "sein haben werden", "trennbar", "bất quy tắc"] },
                { id: "faelle-artikel",       title: "Fälle, Artikel & Pronomen — Cách, mạo từ, đại từ",        tags: ["nominativ", "akkusativ", "dativ", "mạo từ", "đại từ", "sở hữu", "mein dein"] },
                { id: "praepositionen-a1",    title: "Präpositionen — Giới từ cố định (Akk & Dat)",             tags: ["für um durch ohne gegen", "aus bei von mit nach zu seit", "FUDGO"] },
                { id: "modalverben",          title: "Modalverben — Động từ khiếm khuyết",                      tags: ["können müssen wollen sollen dürfen mögen", "modal"] },
                { id: "perfekt",              title: "Perfekt — Thì hiện tại hoàn thành",                       tags: ["haben sein", "partizip II", "quá khứ", "Partizip"] },
                { id: "negation",             title: "Negation — Phủ định (nicht / kein)",                      tags: ["không", "phủ định", "nicht kein"] },
                { id: "plural",               title: "Plural — Số nhiều của danh từ",                           tags: ["số nhiều", "5 nhóm", "Umlaut"] },
                { id: "vergleich",            title: "Vergleich (so…wie) — So sánh bằng",                       tags: ["so wie", "nicht so wie", "so sánh"] },
            ],
            A2: [
                { id: "praeteritum",          title: "Präteritum — Quá khứ đơn",                                tags: ["quá khứ", "sein haben", "Modalverben"] },
                { id: "perfekt-vertiefung",   title: "Perfekt Vertiefung — Mở rộng Perfekt",                    tags: ["partizip II", "bất quy tắc", "tiền tố không tách"] },
                { id: "plusquamperfekt",      title: "Plusquamperfekt — Quá khứ hoàn thành",                    tags: ["nachdem bevor", "hatte war", "quá khứ hoàn thành"] },
                { id: "futur-i",              title: "Futur I — Tương lai đơn",                                  tags: ["werden", "tương lai", "dự đoán"] },
                { id: "wechselpraepositionen",title: "Wechselpräpositionen — Giới từ linh hoạt",                tags: ["in an auf unter über neben hinter vor zwischen", "Wo Wohin", "Dativ Akkusativ"] },
                { id: "reflexivverben",       title: "Reflexivverben — Động từ phản thân",                      tags: ["sich", "phản thân", "sich waschen sich freuen"] },
                { id: "genitiv",              title: "Genitiv — Sở hữu cách",                                   tags: ["cách 2", "sở hữu", "des der", "von Dativ"] },
                { id: "komparativ",           title: "Komparativ & Superlativ — So sánh hơn và nhất",           tags: ["so sánh hơn", "nhất", "Umlaut", "günstiger"] },
                { id: "verben-praepositionen",title: "Verben mit Präpositionen — Động từ đi kèm giới từ",       tags: ["warten auf", "sich interessieren für", "denken an", "sprechen mit"] },
                { id: "temporalsaetze",       title: "Temporalsätze — Mệnh đề thời gian (cơ bản)",              tags: ["wenn als bevor nachdem", "thời gian", "mệnh đề"] },
                { id: "nebensaetze",          title: "Nebensätze (dass, weil, ob) — Mệnh đề phụ cơ bản",        tags: ["dass weil ob", "động từ cuối câu", "mệnh đề phụ"] },
                { id: "indefinitpronomen",    title: "Indefinitpronomen — Đại từ bất định",                     tags: ["man jemand niemand etwas nichts alles viele einige"] },
            ],
            B1: [
                { id: "adjektivdeklination",  title: "Adjektivdeklination — Chia tính từ",                      tags: ["tính từ", "mạo từ xác định bất định không mạo từ", "3 bảng"] },
                { id: "n-deklination",        title: "N-Deklination — Biến cách đặc biệt giống đực",            tags: ["der Herr der Student", "Herrn Studenten", "giống đực"] },
                { id: "vorgangspassiv",       title: "Vorgangspassiv — Bị động hành động",                      tags: ["bị động", "wird wurde ist worden", "gemacht"] },
                { id: "konjunktiv-ii",        title: "Konjunktiv II — Giả định cơ bản",                         tags: ["würde", "hätte wäre", "điều kiện", "lịch sự", "câu ước"] },
                { id: "konjunktionaladverbien",title: "Konjunktionaladverbien — Trạng từ nối",                  tags: ["deshalb trotzdem deswegen jedoch also", "vị trí số 2"] },
                { id: "relativsatz",          title: "Relativsatz — Mệnh đề quan hệ",                           tags: ["der die das welcher", "quan hệ", "chia theo giống và cách"] },
                { id: "infinitiv-zu",         title: "Infinitiv mit zu & Finalsätze — Mục đích",                tags: ["um zu", "ohne zu", "statt zu", "damit", "mục đích"] },
                { id: "pronominaladverbien",  title: "Pronominaladverbien — Đại từ chỉ nơi chốn/vật",          tags: ["darauf dafür dazu daran darüber", "giới từ danh từ"] },
                { id: "indirekte-fragen",     title: "Indirekte Fragen — Câu hỏi gián tiếp",                    tags: ["wann ob wie", "động từ cuối câu", "gián tiếp"] },
                { id: "temporalsaetze-b1",    title: "Temporalsätze Erweiterung — Mệnh đề thời gian (mở rộng)", tags: ["während seitdem", "trong khi từ khi"] },
                { id: "kausalsaetze",         title: "Kausalsätze — Mệnh đề lý do",                             tags: ["weil da", "lý do", "vì"] },
                { id: "konzessivsaetze",      title: "Konzessivsätze (obwohl, trotzdem) — Nhượng bộ",           tags: ["obwohl trotzdem", "mặc dù tuy nhiên", "nhượng bộ"] },
                { id: "tekamolo",             title: "TE-KA-MO-LO — Trật tự bổ ngữ nâng cao",                  tags: ["thời gian nguyên nhân cách thức địa điểm", "trật tự từ"] },
            ],
            B2: [
                { id: "passiv-vertiefung",    title: "Passiv Vertiefung — Bị động mở rộng",                     tags: ["Zustandspassiv", "Passiv Modalverben", "sein zu lassen", "bị động"] },
                { id: "subjektive-modalverben",title: "Subjektive Modalverben — Động từ khiếm khuyết chủ quan", tags: ["muss dürfte wird wohl kann", "suy đoán", "chủ quan"] },
                { id: "konjunktiv-i",         title: "Konjunktiv I — Gián tiếp lời nói (báo chí)",              tags: ["tường thuật", "lời người khác", "báo chí", "sei habe"] },
                { id: "konjunktiv-ii-b2",     title: "Konjunktiv II Vertiefung — Giả định mở rộng",             tags: ["als ob als wenn", "cứ như thể là", "giả định"] },
                { id: "nominalisierung",      title: "Nominalisierung — Chuyển động từ → danh từ",              tags: ["entscheidung ankunft", "danh từ hóa", "nominalisierung"] },
                { id: "partizip",             title: "Partizip I/II & Partizipialattribute — Phân từ làm định ngữ", tags: ["lesend gelesene", "phân từ", "cụm định ngữ"] },
                { id: "funktionsverbgefuege", title: "Funktionsverbgefüge — Cụm động từ chức năng",             tags: ["zur Entscheidung bringen", "in Betrieb nehmen", "zum Ausdruck"] },
                { id: "modalpartikeln",       title: "Modalpartikeln — Tiểu từ tình thái",                      tags: ["ja doch halt eben mal aber wohl", "cảm xúc", "tiểu từ"] },
                { id: "konjunktionen",        title: "Fortführende Konjunktionen — Liên từ đôi",                tags: ["zwar aber entweder oder weder noch sowohl als auch"] },
                { id: "futur-ii",             title: "Futur II — Tương lai hoàn thành",                         tags: ["wird sein haben", "suy đoán", "tương lai hoàn thành"] },
                { id: "adjektiv-als-nomen",   title: "Adjektiv als Nomen — Tính từ hóa danh từ",               tags: ["etwas Gutes der Alte Bekannte", "tính từ danh từ"] },
                { id: "konzessivsaetze-b2",   title: "Konzessivsätze erweitert — Nhượng bộ nâng cao",           tags: ["auch wenn selbst wenn", "cho dù", "nhượng bộ"] },
                { id: "konsekutivsaetze",     title: "Konsekutivsätze — Mệnh đề chỉ kết quả",                  tags: ["so dass", "vì vậy đến nỗi mà", "kết quả"] },
            ],
        };

        const LEVELS = ["A1", "A2", "B1", "B2"];
        const LEVEL_LABELS = {
            A1: "Sơ cấp", A2: "Sơ — Trung cấp",
            B1: "Trung cấp", B2: "Trung — Cao cấp",
        };

        const allLevelsEl = document.getElementById("allLevels");
        const searchInput  = document.getElementById("searchInput");
        const searchResults = document.getElementById("searchResults");

        // ====== BUILD DANH MỤC ======
        LEVELS.forEach((level) => {
            const lessons = GRAMMAR_INDEX[level] || [];
            const section = document.createElement("div");
            section.className = "level-section";
            section.dataset.level = level;

            // ── Mục lớn ──
            const header = document.createElement("div");
            header.className = `level-header lv-${level}`;
            header.innerHTML = `
                <span class="level-badge badge-${level}">${level}</span>
                <div class="level-info">
                    <div class="level-name c-${level}">${LEVEL_LABELS[level]}</div>
                    <div class="level-sub">${lessons.length} bài ngữ pháp</div>
                </div>
                <span class="level-count-badge lcb-${level}">${lessons.length}</span>
                <span class="level-chevron">▾</span>
            `;
            header.addEventListener("click", () => section.classList.toggle("open"));
            section.appendChild(header);

            // ── Danh sách bài (mục con) — mỗi bài là 1 link mở trang mới ──
            const list = document.createElement("div");
            list.className = "lesson-list";
            lessons.forEach((lesson) => {
                const a = document.createElement("a");
                a.className = "lesson-link";
                a.href = `grammar/${lesson.id}.html`;
                a.innerHTML = `
                    <span class="lesson-dot dot-${level}"></span>
                    <span>${lesson.title}</span>
                    <span class="lesson-arrow">→</span>
                `;
                list.appendChild(a);
            });
            section.appendChild(list);
            allLevelsEl.appendChild(section);
        });

        // ====== TÌM KIẾM ======
        searchInput.addEventListener("input", () => {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) {
                searchResults.innerHTML = "";
                searchResults.classList.remove("show");
                allLevelsEl.style.display = "block";
                return;
            }
            allLevelsEl.style.display = "none";
            searchResults.innerHTML = "";
            searchResults.classList.add("show");

            const hits = [];
            LEVELS.forEach((level) => {
                (GRAMMAR_INDEX[level] || []).forEach((lesson) => {
                    const hay = [lesson.title, ...(lesson.tags || [])].join(" ").toLowerCase();
                    if (hay.includes(q)) hits.push({ lesson, level });
                });
            });

            if (hits.length === 0) {
                searchResults.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:30px 0;font-size:14px;">Không tìm thấy bài nào phù hợp.</div>`;
                return;
            }
            hits.forEach(({ lesson, level }) => {
                const a = document.createElement("a");
                a.className = "search-result-item";
                a.href = `grammar/${lesson.id}.html`;
                a.innerHTML = `
                    <span class="lesson-dot dot-${level}"></span>
                    <span class="sr-title">${lesson.title}</span>
                    <span class="sr-badge badge-${level}">${level}</span>
                    <span class="lesson-arrow">→</span>
                `;
                searchResults.appendChild(a);
            });
        });
    </script>
</body>
</html>
